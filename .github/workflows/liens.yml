name: Liens du site
on:
  schedule:
    - cron: "17 6 * * 1"   # chaque lundi, 08:17 à Paris (heure d'été)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: node scripts/verifier-liens.mjs https://www.dataparl.fr
