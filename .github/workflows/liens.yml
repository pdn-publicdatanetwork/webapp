name: Liens du site
on:
  schedule:
    - cron: "17 6 * * 1"   # chaque lundi, 08:17 à Paris (heure d'été)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node scripts/verifier-liens.mjs https://www.dataparl.fr
