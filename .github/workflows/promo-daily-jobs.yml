name: Promo Daily Jobs

# Promotion ponctuelle sur le canal Telegram du Daily (@dataparl_daily).
# Migrée depuis GitLab (le job GitLab ne se déclenchait que si le titre
# du commit contenait « promo-daily ») : ici, déclenchement manuel.
# Le message vient de scripts/promo-daily-message.txt sur GitLab
# (absent ou vide : rien n'est envoyé, sortie propre).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promo-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Code source (archive GitLab)
        run: |
          set -euo pipefail
          curl -sf -H "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
            "https://gitlab.com/api/v4/projects/88469399/repository/archive.tar.gz" \
            -o /tmp/repo.tar.gz
          mkdir -p repo
          tar -xzf /tmp/repo.tar.gz -C repo --strip-components 1
          rm -f /tmp/repo.tar.gz
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Secret (TELEGRAM_BOT_TOKEN)
        working-directory: repo
        run: |
          set -euo pipefail
          curl -sf -H "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
            "https://gitlab.com/api/v4/projects/88469399/variables?per_page=100" -o /tmp/vars.json
          v=$(jq -r '.[] | select(.key=="TELEGRAM_BOT_TOKEN") | .value' /tmp/vars.json)
          if [ -z "$v" ] || [ "$v" = "null" ]; then
            echo "ERREUR : TELEGRAM_BOT_TOKEN absent des variables GitLab."
            exit 1
          fi
          echo "::add-mask::$v"
          {
            echo "TELEGRAM_BOT_TOKEN<<DPV_SECRET_EOF"
            echo "$v"
            echo "DPV_SECRET_EOF"
          } >> "$GITHUB_ENV"
          rm -f /tmp/vars.json
      - name: Publication
        working-directory: repo
        run: node scripts/promo-daily.mjs
