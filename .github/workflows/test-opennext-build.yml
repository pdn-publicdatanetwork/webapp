name: Test build OpenNext Cloudflare

# Validation ponctuelle : la migration Vercel -> Cloudflare Workers (OpenNext)
# n'a jamais ete buildee. Ce workflow compile les deux apps (www + jobs)
# sur une branche de test, sans deploy, sans secret.
on:
  push:
    branches: [test-opennext]
  workflow_dispatch:

jobs:
  build-www:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save @opennextjs/cloudflare wrangler
      - run: npx opennextjs-cloudflare build
      - name: Artefact de controle
        run: ls .open-next && du -sh .open-next

  build-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm install --no-save @opennextjs/cloudflare wrangler
      - run: npx opennextjs-cloudflare build
      - name: Artefact de controle
        run: ls .open-next && du -sh .open-next
