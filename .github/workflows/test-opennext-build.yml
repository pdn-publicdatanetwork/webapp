name: Test build OpenNext Cloudflare

# v5 : www -> npm install (lock desynchro avec package.json),
# opennext installe avec --legacy-peer-deps (peer next >=16.4.5
# vs projet en 16.4.3). Le build dira si l'incompatibilite est reelle.
on:
  push:
    branches: [test-opennext]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-www:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install www
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee -a build.log
      - name: Install opennext
        run: |
          set -o pipefail
          npm install --no-save --legacy-peer-deps @opennextjs/cloudflare wrangler 2>&1 | tee -a build.log
      - name: Build OpenNext (www)
        run: |
          set -o pipefail
          npx opennextjs-cloudflare build 2>&1 | tee -a build.log
      - name: Verdict www
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$(echo ${{env.JOB_STATUS}})" = "success" ]; then
            echo -n "BUILD WWW OK" > verdict.txt
          elif [ -f build.log ]; then
            python3 -c "log=open('build.log',errors='replace').read(); txt='ECHEC BUILD WWW:\n\n\u0060\u0060\u0060\n'+log[-24000:]+'\n\u0060\u0060\u0060'; open('verdict.txt','w').write(txt)"
          else
            echo -n "ECHEC BUILD WWW sans log" > verdict.txt
          fi
          gh api repos/pdn-publicdatanetwork/webapp/issues/174/comments -F body=@verdict.txt
  build-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install jobs
        run: |
          set -o pipefail
          npm install --no-package-lock --no-audit --no-fund 2>&1 | tee -a build.log
      - name: Install opennext jobs
        run: |
          set -o pipefail
          npm install --no-save --legacy-peer-deps @opennextjs/cloudflare wrangler 2>&1 | tee -a build.log
      - name: Build OpenNext (jobs)
        run: |
          set -o pipefail
          npx opennextjs-cloudflare build 2>&1 | tee -a build.log
      - name: Verdict jobs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$(echo ${{env.JOB_STATUS}})" = "success" ]; then
            echo -n "BUILD JOBS OK" > verdict.txt
          elif [ -f build.log ]; then
            python3 -c "log=open('build.log',errors='replace').read(); txt='ECHEC BUILD JOBS:\n\n\u0060\u0060\u0060\n'+log[-24000:]+'\n\u0060\u0060\u0060'; open('verdict.txt','w').write(txt)"
          else
            echo -n "ECHEC BUILD JOBS sans log" > verdict.txt
          fi
          gh api repos/pdn-publicdatanetwork/webapp/issues/174/comments -F body=@verdict.txt
