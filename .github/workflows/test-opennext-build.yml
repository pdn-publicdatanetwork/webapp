name: Test build OpenNext Cloudflare

# v3 : tout le flux est journalise (tee -a) et le verdict est tolerant a
# l'absence de log : la cause exacte de l'echec est toujours postee dans
# l'issue #174, meme si la panne survient des le npm install.
on:
  push:
    branches: [test-opennext]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

  build-www:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set -o pipefail
          npm ci 2>&1 | tee -a build.log
      - run: |
          set -o pipefail
          npm install --no-save @opennextjs/cloudflare wrangler 2>&1 | tee -a build.log
      - name: Build OpenNext (www)
        run: |
          set -o pipefail
          npx opennextjs-cloudflare build 2>&1 | tee -a build.log
      - name: Verdict www
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$(echo ${{env.JOB_STATUS}})" = "success" ]; then
            echo -n "BUILD WWW OK" > verdict.txt
          elif [ -f build.log ]; then
            python3 -c "log=open('build.log',errors='replace').read(); txt='ECHEC BUILD WWW :\n\n\u0060\u0060\u0060\n'+log[-24000:]+'\n\u0060\u0060\u0060'; open('verdict.txt','w').write(txt)"
          else
            echo -n "ECHEC BUILD WWW sans log : la panne a eu lieu avant toute commande tee (npm install ?)" > verdict.txt
          fi
          gh api repos/pdn-publicdatanetwork/webapp/issues/174/comments -F body=@verdict.txt
  build-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set -o pipefail
          npm install --no-package-lock 2>&1 | tee -a build.log
      - run: |
          set -o pipefail
          npm install --no-save @opennextjs/cloudflare wrangler 2>&1 | tee -a build.log
      - name: Build OpenNext (jobs)
        run: |
          set -o pipefail
          npx opennextjs-cloudflare build 2>&1 | tee -a build.log
      - name: Verdict jobs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$(echo ${{env.JOB_STATUS}})" = "success" ]; then
            echo -n "BUILD JOBS OK" > verdict.txt
          elif [ -f build.log ]; then
            python3 -c "log=open('build.log',errors='replace').read(); txt='ECHEC BUILD JOBS :\n\n\u0060\u0060\u0060\n'+log[-24000:]+'\n\u0060\u0060\u0060'; open('verdict.txt','w').write(txt)"
          else
            echo -n "ECHEC BUILD JOBS sans log : la panne a eu lieu avant toute commande tee (npm install ?)" > verdict.txt
          fi
          gh api repos/pdn-publicdatanetwork/webapp/issues/174/comments -F body=@verdict.txt
