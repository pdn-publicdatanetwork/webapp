name: Test build OpenNext Cloudflare

# Validation migration Vercel -> Cloudflare Workers (OpenNext) :
# compile www (racine) et jobs (jobs/) sans deploy. En cas d'echec, la fin
# du log est postee dans l'issue #174 pour lecture hors API logs.
on:
  push:
    branches: [test-opennext]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-www:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save @opennextjs/cloudflare wrangler
      - name: Build OpenNext (www)
        run: |
          set -o pipefail
          npx opennextjs-cloudflare build 2>&1 | tee build.log
      - name: Verdict www
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo -n "BUILD WWW OK" > verdict.txt
          else
            python3 -c "import sys; log=open('build.log',errors='replace').read(); txt='ECHEC BUILD WWW :\n\n\`\`\`\n'+log[-24000:]+'\n\`\`\`'; open('verdict.txt','w').write(txt)"
          fi
          gh api repos/pdn-publicdatanetwork/webapp/issues/174/comments -f body=@verdict.txt
  build-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm install --no-save @opennextjs/cloudflare wrangler
      - name: Build OpenNext (jobs)
        run: |
          set -o pipefail
          npx opennextjs-cloudflare build 2>&1 | tee build.log
      - name: Verdict jobs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo -n "BUILD JOBS OK" > verdict.txt
          else
            python3 -c "import sys; log=open('build.log',errors='replace').read(); txt='ECHEC BUILD JOBS :\n\n\`\`\`\n'+log[-24000:]+'\n\`\`\`'; open('verdict.txt','w').write(txt)"
          fi
          gh api repos/pdn-publicdatanetwork/webapp/issues/174/comments -f body=@verdict.txt
