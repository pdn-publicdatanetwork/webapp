name: Sentinelle échecs CI

# Alerte immédiate quand un workflow de main échoue (déploiement, build,
# cron) : commentaire sur l'issue de sentinelle #205 + appel du Worker
# Cloudflare dataparl-sentinelle qui envoie le mail d'alerte depuis
# admin@mail.dataparl.com (Email Service).
#
# Zéro secret GitHub : le Worker vérifie le jeton OIDC de CE run
# (id-token: write, audience dataparl-sentinelle), sa signature (JWKS
# GitHub), l'émetteur et le dépôt autorisé, comme la route ci-jeton.
# L'URL du Worker est la variable de dépôt SENTINELLE_URL (Settings ->
# Secrets and variables -> Actions -> Variables) ; tant qu'elle est
# vide, l'étape mail est simplement sautée.

on:
  workflow_run:
    types: [completed]
    branches: [main]

permissions:
  issues: write
  id-token: write

jobs:
  alerter:
    # Seulement les échecs, hors la sentinelle elle-même (pas de boucle).
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name != 'Sentinelle échecs CI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Commentaire d'alerte sur l'issue sentinelle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          WF_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail
          corps=$(printf 'Échec du workflow « %s » sur main.

Commit : `%s` (%s)
Run : %s

Coller ce lien à Vibe (Le Chat) pour diagnostic et correctif.' "$WF_NAME" "$WF_SHA" "$WF_MSG" "$WF_URL")
          gh api --method POST "repos/$REPO/issues/205/comments" -f body="$corps"

      - name: Jeton OIDC GitHub
        id: oidc
        run: |
          set -euo pipefail
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          jeton=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dataparl-sentinelle" | jq -r .value)
          test -n "$jeton"
          echo "jwt=$jeton" >> "$GITHUB_OUTPUT"

      - name: Alerte mail via le Worker Cloudflare
        if: ${{ vars.SENTINELLE_URL != '' }}
        env:
          URL: ${{ vars.SENTINELLE_URL }}
          JWT: ${{ steps.oidc.outputs.jwt }}
          REPO: ${{ github.repository }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          WF_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail
          charge=$(jq -n --arg repo "$REPO" --arg workflow "$WF_NAME" --arg run_url "$WF_URL" --arg sha "$WF_SHA" --arg commit "$WF_MSG" \
            '{repo: $repo, workflow: $workflow, run_url: $run_url, sha: $sha, commit: $commit}')
          curl -sSf -X POST "$URL/alerte" \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            -d "$charge"
