name: Recuperation secrets GitLab

# ONE-SHOT migration (22/11/2026). Recupere les variables CI du projet
# GitLab Jobs (88469399) et pousse les secrets correspondants sur les
# Workers Cloudflare (www = dataparl, jobs = dataparl-jobs). Les valeurs ne
# sont JAMAIS affichees : le verdict dans l issue #174 ne contient que des
# noms, des codes HTTP et des etapes. Identites par jeton OIDC GitHub
# (audience dataparl-ci) : PAT GitLab via /api/cron/ci-jeton, token + account
# Cloudflare via /api/cron/ci-jeton-cloudflare?app=www. Les routes sont
# appelees sur dataparl.dataparl.workers.dev : le domaine www.dataparl.fr
# sert la page de maintenance pendant la migration. Le jeton OIDC est
# re-minte a chaque essai (validite 5 min) et les routes attendent le
# redeploy du Worker www (accept list des workflows dans la route).

on:
  push:
    branches: [main]
    paths: [".trigger-recupgitlab.txt"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: recuperation-gitlab
  cancel-in-progress: false

jobs:
  recup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Identites + push secrets
        run: |
          set -euo pipefail
          etape() { echo "ETAPE $1" | tee -a resum.txt; }
          etape "depart"
          rapport=""
          for i in $(seq 1 96); do
            oidc=$(curl -fsS --connect-timeout 15 --max-time 30 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dataparl-ci" | jq -r .value) || { etape "mint essai $i: echec"; sleep 15; continue; }
            test -n "$oidc" || { etape "mint essai $i: vide"; sleep 15; continue; }
            c1=000
            c2=000
            c1=$(curl -s -o gitlab.json -w "%{http_code}" --max-time 30 -H "x-oidc: $oidc" "https://dataparl.dataparl.workers.dev/api/cron/ci-jeton")
            if [ "$c1" = "200" ]; then
              c2=$(curl -s -o cf.json -w "%{http_code}" --max-time 30 -H "x-oidc: $oidc" "https://dataparl.dataparl.workers.dev/api/cron/ci-jeton-cloudflare?app=www")
            fi
            if [ "$c1" = "200" ] && [ "$c2" = "200" ]; then
              rapport=ok
              break
            fi
            etape "essai $i: ci-jeton=$c1 ci-jeton-cf=$c2"
            sleep 15
          done
          if [ -z "$rapport" ]; then
            etape "routes CI indisponibles"
            exit 1
          fi
          etape "routes ok (essai $i)"
          test -s gitlab.json || { etape "gitlab.json vide"; exit 1; }
          test -s cf.json || { etape "cf.json vide"; exit 1; }
          gt=$(jq -r .token gitlab.json)
          ct=$(jq -r .token cf.json)
          acc=$(jq -r .account_id cf.json)
          test -n "$gt" || { etape "PAT GitLab vide"; exit 1; }
          test -n "$ct" || { etape "token CF vide"; exit 1; }
          test -n "$acc" || { etape "account CF vide"; exit 1; }
          etape "extraction ok"
          rm -f gitlab.json cf.json
          code=$(curl -s -o vars.json -w "%{http_code}" --max-time 60 -H "PRIVATE-TOKEN: $gt" "https://gitlab.com/api/v4/projects/88469399/variables?per_page=100")
          if [ "$code" != "200" ]; then
            etape "API GitLab: HTTP $code"
            head -c 300 vars.json 2>/dev/null | tee -a resum.txt
            exit 1
          fi
          test -s vars.json || { etape "vars.json vide"; exit 1; }
          etape "variables GitLab chargees"
          push() {
            local w="$1" cw="$2" cg="$3" json="${4:-}" val code
            val=$(jq -r --arg k "$cg" '.[] | select(.key == $k) | .value' vars.json)
            if [ -z "$val" ] || [ "$val" = "null" ]; then
              echo "$w/$cw ABSENT" | tee -a resum.txt
              return 0
            fi
            if [ "$json" = "json" ]; then
              val=$(printf "%s" "$val" | jq -c .)
            fi
            case "$val" in *$'\n'*) ;; *) echo "::add-mask::$val" ;; esac
            code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT -H "Authorization: Bearer $ct" -H "Content-Type: application/json" -d "$(jq -n --arg n "$cw" --arg t "$val" '{"name":$n,"text":$t,"type":"secret_text"}')" "https://api.cloudflare.com/client/v4/accounts/$acc/workers/scripts/$w/secrets")
            echo "$w/$cw HTTP $code" | tee -a resum.txt
          }
          push dataparl DATA_SUPABASE_SERVICE_ROLE_KEY DATA_SUPABASE_KEY
          push dataparl RESEND_API_KEY RESEND_API_KEY
          push dataparl APP_SECRET APP_SECRET
          push dataparl TELEGRAM_BOT_TOKEN TELEGRAM_BOT_TOKEN
          push dataparl FIREBASE_SERVICE_ACCOUNT FIREBASE_SERVICE_ACCOUNT json
          push dataparl-jobs APP_SECRET APP_SECRET
          push dataparl-jobs FIREBASE_SERVICE_ACCOUNT FIREBASE_SERVICE_ACCOUNT json
          rm -f vars.json
      - name: Verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf "RECUPERATION GITLAB : " > verdict.txt
          echo "$JOB_STATUS" >> verdict.txt
          if [ -f resum.txt ]; then
            cat resum.txt >> verdict.txt
          fi
          gh api repos/pdn-publicdatanetwork/webapp/issues/174/comments -F body=@verdict.txt || echo "publication verdict impossible"
