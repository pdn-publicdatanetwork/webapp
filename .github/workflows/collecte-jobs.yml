name: Collecte Jobs

# CI de la collecte DataParl' Jobs, migrée depuis GitLab (plan Free :
# quota de 400 minutes/mois épuisé, GitHub en offre 2000). Le CODE SOURCE
# reste sur GitLab (publicdatanetwork-group/dataparl-jobs, projet
# 88469399) : ce workflow télécharge son archive à chaque run. Les
# SECRETS restent dans les variables CI du projet GitLab (source de
# vérité), lues via l'API au démarrage.
#
# Jeton GitLab : AUCUN secret GitHub, AUCUN jeton embarqué (rotation du
# 17/11/2026 après compromission de l'ancien jeton exposé en clair dans
# ce fichier, dépôt public). Le jeton est remis au run par la route du
# webapp www.dataparl.fr/api/cron/ci-jeton après validation du jeton
# OIDC GitHub de CE run (id-token: write, audience dataparl-ci, branche
# main uniquement). Le PAT vit dans la table ci_secrets Supabase
# (dataparl-auth) ; sa rotation = POST /personal_access_tokens/:id/rotate
# puis mise à jour de la ligne SQL, sans toucher à ce fichier.
#
# Déclenchement : planification 2 fois par jour (12h00 et 18h00 Paris,
# heure d'hiver), « Run workflow » manuel, ou push d'une modification du
# fichier jobs-collecte.trigger.
#
# Alertes e-mail : envoyées par le webapp (route /api/cron/alertes-jobs,
# Bearer APP_SECRET, clé Resend du projet Vercel où dataparl.fr est
# vérifié) ; RESEND_API_KEY des variables GitLab ne sert plus que pour
# la notification POL JOBS (scripts/notif-poljobs.mjs).

on:
  schedule:
    - cron: "0 11 * * *"   # 12h00 Paris (UTC+1, heure d'hiver)
    - cron: "0 17 * * *"   # 18h00 Paris (UTC+1)
  workflow_dispatch:
    inputs:
      skip_promo_telegram:
        description: "Sauter la promotion Telegram (run de test)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["jobs-collecte.trigger"]

permissions:
  contents: read
  id-token: write   # jeton OIDC pour la remise du jeton GitLab (route ci-jeton)

concurrency:
  group: collecte-jobs
  cancel-in-progress: false

env:
  SKIP_PROMO_TELEGRAM: "false"   # « true » = promo Telegram sautée (run de test)

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Jeton GitLab (OIDC)
        run: |
          set -euo pipefail
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          jeton=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dataparl-ci" | jq -r .value)
          test -n "$jeton"
          code=$(curl -sSf -o /tmp/ci-jeton.json -w "%{http_code}" \
            -H "x-oidc: $jeton" \
            "https://dataparl.dataparl.workers.dev/api/cron/ci-jeton")
          v=$(jq -r '.token // empty' /tmp/ci-jeton.json)
          rm -f /tmp/ci-jeton.json
          test -n "$v"
          echo "::add-mask::$v"
          {
            echo "GITLAB_TOKEN<<DPV_SECRET_EOF"
            echo "$v"
            echo "DPV_SECRET_EOF"
          } >> "$GITHUB_ENV"
      - name: Code source (archive GitLab)
        run: |
          set -euo pipefail
          curl -sf -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://gitlab.com/api/v4/projects/88469399/repository/archive.tar.gz" \
            -o /tmp/repo.tar.gz
          mkdir -p repo
          tar -xzf /tmp/repo.tar.gz -C repo --strip-components 1
          rm -f /tmp/repo.tar.gz
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Secrets (variables CI GitLab)
        working-directory: repo
        run: |
          set -euo pipefail
          curl -sf -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://gitlab.com/api/v4/projects/88469399/variables?per_page=100" -o /tmp/vars.json
          for k in DATA_SUPABASE_KEY RESEND_API_KEY APP_SECRET MISTRAL_API_KEY TELEGRAM_BOT_TOKEN FIREBASE_SERVICE_ACCOUNT GOOGLE_INDEXING_ACCOUNT; do
            v=$(jq -r --arg k "$k" '.[] | select(.key==$k) | .value' /tmp/vars.json)
            if [ -z "$v" ] || [ "$v" = "null" ]; then
              echo "ATTENTION : variable GitLab $k absente (le script concerné gère son absence)."
              continue
            fi
            case "$v" in *$'\n'*) ;; *) echo "::add-mask::$v" ;; esac
            {
              echo "$k<<DPV_SECRET_EOF"
              echo "$v"
              echo "DPV_SECRET_EOF"
            } >> "$GITHUB_ENV"
          done
          rm -f /tmp/vars.json
          echo "Variables GitLab chargées."
      - name: Installation des dépendances
        working-directory: repo
        run: npm install --no-audit --no-fund
      - name: Collecte des offres
        working-directory: repo
        run: |
          node scripts/collecte-offres.mjs
          node scripts/collecte-offres-elus.mjs
          node scripts/collecte-offres-bluesky.mjs
          node scripts/notif-poljobs.mjs
          node scripts/indexation-google.mjs
      - name: Balayage IA
        working-directory: repo
        run: node scripts/enrichissement-ia.mjs
      - name: Insights élu
        working-directory: repo
        continue-on-error: true   # un raté de scraping ne doit jamais bloquer les alertes
        run: node scripts/insights.mjs
      - name: Alertes e-mail
        run: |
          set -euo pipefail
          # Jeton = APP_SECRET, posé à l'identique dans les variables CI
          # GitLab du projet Jobs et dans les variables Vercel du webapp
          # (vérifié le 17/11/2026 : la route répond 200 à ce bearer). Le
          # sha256 de FIREBASE_SERVICE_ACCOUNT ne convient pas : la
          # variable GitLab est le JSON multi-lignes du fichier de clé, la
          # variable Vercel est le même JSON sur une seule ligne, les
          # empreintes diffèrent (401 sur tous les runs du 13 au 17/11).
          test -n "$APP_SECRET"
          code=$(curl -sS -o /tmp/alerte-jobs.json -w "%{http_code}" \
            -H "Authorization: Bearer $APP_SECRET" \
            "https://dataparl.dataparl.workers.dev/api/cron/alertes-jobs")
          cat /tmp/alerte-jobs.json; echo
          grep -q '"ok"' /tmp/alerte-jobs.json
          test "$code" = 200
      - name: Promotion Telegram
        if: ${{ env.SKIP_PROMO_TELEGRAM != 'true' && inputs.skip_promo_telegram != true }}
        working-directory: repo
        run: node scripts/promotion-offres.mjs
      # Heartbeat Better Stack (24/11/2026), pipeline offres Jobs : la route
      # webapp /api/cron/heartbeat sert l'URL de ping (p=jobs) après
      # validation du jeton OIDC de CE workflow. Ping uniquement sur run
      # réussi : une collecte en échec ne doit pas masquer une panne, la
      # grâce du monitor (12 h + 3 h) couvre largement les 2 runs/jour.
      # Zéro-secret GitHub. La route répond en JSON ({ "url": … }) :
      # extraire l'URL avec sed, jamais passer le corps brut à curl. Best
      # effort, jamais bloquant.
      - name: Heartbeat Better Stack (offres Jobs)
        if: ${{ always() && job.status == 'success' }}
        run: |
          ok=0
          for i in 1 2 3; do
            oidc=$(curl -fsS --connect-timeout 15 --max-time 30 \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dataparl-ci" \
              | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || { sleep 10; continue; }
            [ -n "$oidc" ] || { echo "essai $i : jeton OIDC non obtenu"; sleep 10; continue; }
            route_code=$(curl -sS --max-time 30 -o /tmp/route.json -w "%{http_code}" \
              -H "x-oidc: $oidc" \
              "https://www.dataparl.fr/api/cron/heartbeat?p=jobs") || { sleep 10; continue; }
            url=$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' /tmp/route.json)
            case "${route_code:-000}:$url" in
              2*:https://*) ;;
              *) echo "essai $i : route heartbeat HTTP ${route_code:-000}"; sleep 10; continue ;;
            esac
            curl -fsS --max-time 30 "$url" && { ok=1; break; }
            echo "essai $i : ping Better Stack échoué"
            sleep 10
          done
          [ "$ok" = 1 ] || echo "::warning::Heartbeat Better Stack non envoyé après 3 essais (codes HTTP dans le log ci-dessus)."
