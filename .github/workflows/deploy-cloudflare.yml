name: Deploy Cloudflare Workers

# Migration Vercel -> Cloudflare Workers (OpenNext). Se déclenche à chaque push
# sur main : construit les deux apps puis publie les Workers (www: « dataparl »,
# jobs: « dataparl-jobs »). Zéro secret GitHub : le token Cloudflare et les
# variables de build viennent de la route /api/cron/ci-jeton-cloudflare après
# validation du jeton OIDC GitHub (audience « dataparl-ci »). Le workflow
# attend jusqu'à 12 min que la route (servie par Vercel prod) soit prete :
# jeton OIDC re-minte a CHAQUE essai (validite 5 min) + curl --max-time.
# Build : opennextjs-cloudflare build lance lui-même next build en mode
# webpack + standalone (compatible Next 16). Echecs postes dans l'issue #174.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  www:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identité CI + variables de déploiement
        run: |
          rapport=""
          for i in $(seq 1 48); do
            oidc=$(curl -fsS --connect-timeout 15 --max-time 30 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dataparl-ci" \
              | python3 -c "import json,sys; sys.stdout.write(json.load(sys.stdin)['value'])") || continue
            if curl -fsS --connect-timeout 15 --max-time 30 -H "x-oidc: $oidc" \
              "https://dataparl.dataparl.workers.dev/api/cron/ci-jeton-cloudflare?app=www" -o rapport.json; then
              rapport=ok
              break
            fi
            echo "route CI pas prete ou refusessee (essai $i/48), nouvelle tentative dans 15 s"
            sleep 15
          done
          if [ -z "$rapport" ]; then
            echo "route ci-jeton-cloudflare indisponible apres 12 min" >&2
            exit 1
          fi
          jq -r '"CLOUDFLARE_API_TOKEN=" + .token, "CLOUDFLARE_ACCOUNT_ID=" + .account_id, (.build_vars // {} | to_entries[] | .key + "=" + (.value | tostring))' rapport.json > .cf-env
          cat .cf-env >> "$GITHUB_ENV"
          rm -f .cf-env rapport.json
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --legacy-peer-deps @opennextjs/cloudflare@1.20.17 wrangler
      - name: Build OpenNext (www)
        run: |
          set -o pipefail
          npx opennextjs-cloudflare build 2>&1 | tee build.log
      - name: Deploy www
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
      - name: Verdict www
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf "DEPLOY WWW : " > verdict.txt
          if [ "$JOB_STATUS" = "success" ]; then
            echo "OK" >> verdict.txt
          else
            echo "ECHEC" >> verdict.txt
            : > comb.log
            cat build.log deploy.log 2>/dev/null >> comb.log || true
            python3 -c "log=open('comb.log',errors='replace').read(); txt=' \n\n\u0060\u0060\u0060\n'+log[-24000:]+'\n\u0060\u0060\u0060'; open('verdict.txt','a').write(txt)" || echo "(log illisible)" >> verdict.txt
          fi
          gh api repos/pdn-publicdatanetwork/webapp/issues/174/comments -F body=@verdict.txt || echo "publication verdict impossible"
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identité CI + variables de déploiement
        run: |
          rapport=""
          for i in $(seq 1 48); do
            oidc=$(curl -fsS --connect-timeout 15 --max-time 30 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dataparl-ci" \
              | python3 -c "import json,sys; sys.stdout.write(json.load(sys.stdin)['value'])") || continue
            if curl -fsS --connect-timeout 15 --max-time 30 -H "x-oidc: $oidc" \
              "https://dataparl.dataparl.workers.dev/api/cron/ci-jeton-cloudflare?app=jobs" -o rapport.json; then
              rapport=ok
              break
            fi
            echo "route CI pas prete ou refusessee (essai $i/48), nouvelle tentative dans 15 s"
            sleep 15
          done
          if [ -z "$rapport" ]; then
            echo "route ci-jeton-cloudflare indisponible apres 12 min" >&2
            exit 1
          fi
          jq -r '"CLOUDFLARE_API_TOKEN=" + .token, "CLOUDFLARE_ACCOUNT_ID=" + .account_id, (.build_vars // {} | to_entries[] | .key + "=" + (.value | tostring))' rapport.json > .cf-env
          cat .cf-env >> "$GITHUB_ENV"
          rm -f .cf-env rapport.json
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --legacy-peer-deps @opennextjs/cloudflare@1.20.17 wrangler
      - name: Build OpenNext (jobs)
        run: |
          set -o pipefail
          npx opennextjs-cloudflare build 2>&1 | tee build.log
      - name: Deploy jobs
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
      - name: Verdict jobs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf "DEPLOY JOBS : " > verdict.txt
          if [ "$JOB_STATUS" = "success" ]; then
            echo "OK" >> verdict.txt
          else
            echo "ECHEC" >> verdict.txt
            : > comb.log
            cat build.log deploy.log 2>/dev/null >> comb.log || true
            python3 -c "log=open('comb.log',errors='replace').read(); txt=' \n\n\u0060\u0060\u0060\n'+log[-24000:]+'\n\u0060\u0060\u0060'; open('verdict.txt','a').write(txt)" || echo "(log illisible)" >> verdict.txt
          fi
          gh api repos/pdn-publicdatanetwork/webapp/issues/174/comments -F body=@verdict.txt || echo "publication verdict impossible"
