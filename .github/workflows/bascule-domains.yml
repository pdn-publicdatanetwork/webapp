name: Bascule Domains Cloudflare

# Bascule PRODUCTION : detache les domaines dataparl.fr du worker de
# maintenance et les rattache aux vrais Workers (www -> dataparl,
# jobs.dataparl.fr -> dataparl-jobs). A NE DECLENCHER QUE quand les secrets
# de runtime sensibles ont ete re-poses avec leurs vraies valeurs
# (STRIPE_SECRET_KEY, AUTH/DATA_SUPABASE_SERVICE_ROLE_KEY, APP_SECRET,
# RESEND_API_KEY, SLACK_*, NOTION_*, etc.) et apres validation.
# Declenchement manuel uniquement, avec l'entree confirmer=oui.
# Journal complet publie dans l'issue #174.

on:
  workflow_dispatch:
    inputs:
      confirmer:
        description: "Ecrire exactement oui pour executer la bascule"
        required: true
        default: "non"

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: bascule-domains
  cancel-in-progress: false

jobs:
  bascule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Garde-fou
        run: |
          if [ "${{ github.event.inputs.confirmer }}" != "oui" ]; then
            echo "confirmer != oui : bascule annulee (securite)" | tee garde.txt
            exit 1
          fi
      - name: Token Cloudflare (OIDC -> route CI)
        run: |
          set -euo pipefail
          rapport=""
          for i in $(seq 1 48); do
            oidc=$(curl -fsS --connect-timeout 15 --max-time 30 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dataparl-ci" \
              | python3 -c "import json,sys; sys.stdout.write(json.load(sys.stdin)['value'])") || continue
            if curl -fsS --connect-timeout 15 --max-time 30 -H "x-oidc: $oidc" \
              "https://dataparl.dataparl.workers.dev/api/cron/ci-jeton-cloudflare?app=www" -o rapport.json; then
              rapport=ok
              break
            fi
            sleep 15
          done
          if [ -z "$rapport" ]; then
            echo "route ci-jeton-cloudflare indisponible" >&2
            exit 1
          fi
          jq -r '"CF_TOKEN=" + .token, "CF_ACCOUNT=" + .account_id' rapport.json >> "$GITHUB_ENV"
          rm -f rapport.json
      - name: Bascule des domains
        run: |
          set -uo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/domains"
          aide="Authorization: Bearer $CF_TOKEN"
          echo "===== INVENTAIRE AVANT"
          curl -fsS -H "$aide" "$api" -o avant.json
          jq -r '.result[] | [.hostname, .service] | @tsv' avant.json | tee inventaire_avant.txt
          cible=""
          while IFS=$'\t' read -r hid hname service; do
            [ "$service" = "dataparl-maintenance" ] || continue
            if [ "$hname" = "jobs.dataparl.fr" ]; then cible="dataparl-jobs"; else cible="dataparl"; fi
            echo "===== $hname : $service -> $cible"
            curl -sS -X DELETE -H "$aide" "$api/$hid" -o suppr.json -w "DELETE http=%{http_code}" ; echo
            erreur=$(jq -r '.errors // [] | tostring' suppr.json 2>/dev/null || true)
            code=$(curl -sS -X PUT -H "$aide" -H "Content-Type: application/json" \
              -d '{"zone_id":"6c8155b113e3d8050caddc6cf40d2c68","hostname":"'"$hname"'","service":"'"$cible"'","environment":"production"}' \
              "$api" -o pose.json -w "%{http_code}")
            echo "PUT http=$code"
            echo "$code" | grep -qE "^20[01]$" || { echo "ECHEC pose $hname"; cat pose.json | head -c 400; echo; }
            sleep 2
          done < inventaire_avant.txt
          echo "===== INVENTAIRE APRES"
          curl -fsS -H "$aide" "$api" -o apres.json
          jq -r '.result[] | [.hostname, .service] | @tsv' apres.json | tee inventaire_apres.txt
      - name: Verification sur les vrais domaines
        run: |
          {
            for u in \
              "https://www.dataparl.fr/" \
              "https://www.dataparl.fr/connexion" \
              "https://www.dataparl.fr/jobs" \
              "https://dataparl.fr/" \
              "https://jobs.dataparl.fr/" \
              "https://jobs.dataparl.fr/admin" \
              "https://jobs.dataparl.fr/offre/test"; do
              echo "===== $u"
              curl -sS -i --max-time 25 -H "user-agent: Mozilla/5.0 (sonde)" "$u" 2>&1 | head -c 500
              echo
              sleep 1
            done
          } > /tmp/verif.log 2>&1 || true
          cat /tmp/verif.log
      - name: Publication dans #174 (toujours)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf "BASCULE DOMAINS: job=%s, %s UTC\n\n" "$JOB_STATUS" "$(date -u +%H:%M:%S)" > verdict.txt
          printf '~~~\n' >> verdict.txt
          cat inventaire_avant.txt inventaire_apres.txt /tmp/verif.log 2>/dev/null >> verdict.txt || true
          printf '~~~\n' >> verdict.txt
          gh api repos/pdn-publicdatanetwork/webapp/issues/174/comments -F body=@verdict.txt || echo "publication impossible"
