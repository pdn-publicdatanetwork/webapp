name: Typecheck
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tsc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      # npm install (et non npm ci) : package-lock.json ne référence pas
      # l'arborescence @sentry/nextjs, ce que les versions récentes de npm
      # refusent lors d'un npm ci. À réparer en régénérant le lock localement.
      - run: npm install --no-audit --no-fund
      - name: Contrôle des types
        run: npx tsc --noEmit 2>&1 | tee typecheck.log
      - name: Journal (artefact, 30 jours)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typecheck-log
          path: typecheck.log
          if-no-files-found: ignore
