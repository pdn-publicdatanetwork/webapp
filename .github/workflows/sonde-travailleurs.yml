name: Sonde Travailleurs

# Diagnostic ponctuel : tails (trace-v1) sur les deux Workers + curl -i,
# publie TOUT (meme en cas d'echec) dans l'issue #174.
# Declenche par .sonde-travailleurs.txt.

on:
  push:
    branches: [main]
    paths: [".sonde-travailleurs.txt"]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Token Cloudflare (OIDC -> route CI, tolerante)
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5; do
            echo "--- essai $i"
            curl -sS --connect-timeout 15 --max-time 30 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dataparl-ci" -o /tmp/oidc.raw -w "oidc_http=%{http_code}" || true
            echo
            oidc=$(python3 -c "import json;print(json.load(open('/tmp/oidc.raw'))['value'])" 2>/dev/null || true)
            if [ -n "$oidc" ]; then
              curl -sS --connect-timeout 15 --max-time 30 -H "x-oidc: $oidc" \
                "https://dataparl.dataparl.workers.dev/api/cron/ci-jeton-cloudflare?app=www" -o /tmp/rapport.json -w "route_http=%{http_code}"
              echo
              if [ -s /tmp/rapport.json ] && jq -e '.token' /tmp/rapport.json >/dev/null 2>&1; then
                jq -r '"CF_TOKEN=" + .token, "CF_ACCOUNT=" + .account_id' /tmp/rapport.json >> "$GITHUB_ENV"
                echo "token obtenu"
                exit 0
              fi
              echo "reponse route:"; head -c 400 /tmp/rapport.json 2>/dev/null || echo "(vide)"
            fi
            sleep 10
          done
          echo "ECHEC_TOKEN"
      - name: Tails + curls
        if: always()
        run: |
          if [ -n "$CF_TOKEN" ]; then
            cd .github/sonde
            node tail.mjs dataparl 26000 > /tmp/tail_www.log 2>&1 &
            node tail.mjs dataparl-jobs 26000 > /tmp/tail_jobs.log 2>&1 &
            sleep 3
          fi
          {
            for u in \
              "https://dataparl.dataparl.workers.dev/" \
              "https://dataparl.dataparl.workers.dev/connexion" \
              "https://dataparl.dataparl.workers.dev/jobs" \
              "https://dataparl.dataparl.workers.dev/api/auth/session" \
              "https://dataparl-jobs.dataparl.workers.dev/" \
              "https://dataparl-jobs.dataparl.workers.dev/?a=1" \
              "https://dataparl-jobs.dataparl.workers.dev/api/stats/resume" \
              "https://dataparl-jobs.dataparl.workers.dev/admin"; do
              echo "===== $u"
              curl -sS -i --max-time 25 -H "user-agent: Mozilla/5.0 (sonde)" "$u" 2>&1 | head -c 700
              echo
              sleep 1
            done
          } > /tmp/sonde.log 2>&1 || true
          cat /tmp/sonde.log
          if [ -n "$CF_TOKEN" ]; then
            sleep 24
            echo "===== TAIL WWW ====="; cat /tmp/tail_www.log 2>/dev/null || true
            echo "===== TAIL JOBS ====="; cat /tmp/tail_jobs.log 2>/dev/null || true
          else
            echo "(pas de token Cloudflare: tails sautes)" | tee -a /tmp/sonde.log
          fi
      - name: Publication dans #174 (toujours)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf "SONDE TRAVAILLEURS: job=%s, %s UTC\n\n" "$JOB_STATUS" "$(date -u +%H:%M:%S)" > verdict.txt
          printf '~~~\n' >> verdict.txt
          cat /tmp/sonde.log /tmp/tail_www.log /tmp/tail_jobs.log 2>/dev/null >> verdict.txt || true
          printf '~~~\n' >> verdict.txt
          gh api repos/pdn-publicdatanetwork/webapp/issues/174/comments -F body=@verdict.txt || echo "publication impossible"
