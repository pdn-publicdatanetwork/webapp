name: Env push Cloudflare Workers

# Pousse les secrets runtime Vercel vers les Workers Cloudflare via la route
# /api/cron/env-push-cloudflare (validation jeton OIDC GitHub ; aucune valeur
# ne transite par GitHub). Declenchement : push sur .trigger-envpush.txt sur
# main. Attend jusqu a 12 min que la route (deployee par Vercel) reponde.
# Verdict (noms + statuts, jamais de valeurs) poste dans l issue #174.

on:
  push:
    branches: [main]
    paths: [".trigger-envpush.txt"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: env-push-cloudflare
  cancel-in-progress: false

jobs:
  push-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mint OIDC + appel route env-push
        run: |
          rapport=""
          for i in $(seq 1 48); do
            oidc=$(curl -fsS --connect-timeout 15 --max-time 30 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dataparl-ci" | python3 -c "import json,sys; sys.stdout.write(json.load(sys.stdin)['value'])") || continue
            if curl -fsS --connect-timeout 15 --max-time 60 -H "x-oidc: $oidc" "https://www.dataparl.fr/api/cron/env-push-cloudflare" -o rapport.json; then
              rapport=ok
              break
            fi
            echo "route env-push pas prete ou refusee (essai $i/48), nouvelle tentative dans 15 s"
            sleep 15
          done
          if [ -z "$rapport" ]; then
            echo "route env-push indisponible apres 12 min" >&2
            exit 1
          fi
          cat rapport.json
      - name: Verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf "ENV PUSH CLOUDFLARE : " > verdict.txt
          echo "$JOB_STATUS" >> verdict.txt
          if [ -f rapport.json ]; then
            printf "\n\n```\n" >> verdict.txt
            cat rapport.json >> verdict.txt
            printf "\n```\n" >> verdict.txt
          fi
          gh api repos/pdn-publicdatanetwork/webapp/issues/174/comments -F body=@verdict.txt || echo "publication verdict impossible"
