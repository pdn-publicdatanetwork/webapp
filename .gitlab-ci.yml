# DataParl' — CI GitLab
#
# Trois usages :
# 1. build (toute branche) : compile l'app Next.js pour Cloudflare Workers (OpenNext).
# 2. deploy (main uniquement) : publie le Worker sur Cloudflare.
# 3. anti-abus (pipeline planifiée) : filet de secours si les Cron Triggers
#    Cloudflare venaient à manquer un passage ; appelle la route en production.
#
# Variables CI à définir (Settings > CI/CD > Variables) :
# - CLOUDFLARE_API_TOKEN (masquée) : token Cloudflare avec droits Workers
# - CLOUDFLARE_ACCOUNT_ID (masquée) : identifiant du compte Cloudflare
# - CRON_SECRET (masquée) : même valeur que sur Vercel
# - NEXT_PUBLIC_* (voir docs/deploiement-gitlab-cloudflare.md) : à définir
#   pour que le build embarque les valeurs publiques.

stages: [build, deploy]

build:
  stage: build
  image: node:22
  script:
    - npm ci
    # Outils Workers installés à la volée : package.json reste synchronisé
    # avec package-lock.json (Vercel construit aussi ce dépôt, npm ci requis).
    - npm install --no-save @opennextjs/cloudflare wrangler
    - npx opennextjs-cloudflare build
  artifacts:
    paths:
      - .open-next
    expire_in: 1 day
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

deploy:
  stage: deploy
  image: node:22
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - npm install --no-save @opennextjs/cloudflare wrangler
    - npx wrangler deploy
  environment:
    name: production
    url: https://www.dataparl.fr

# Filet de secours anti-abus : les Cron Triggers Cloudflare appellent déjà la
# route chaque heure (voir wrangler.jsonc). Cette pipeline planifiée redondante
# garantit au moins un appel par période planifiée (schedule : horaire).
anti-abus:
  stage: deploy
  image: alpine:3.20
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apk add --no-cache curl > /dev/null
  script:
    - |
      echo "anti-abus $(date -u +%FT%TZ) : appel de https://www.dataparl.fr/api/cron/anti-abus"
      curl --fail --silent --show-error --max-time 110         -H "Authorization: Bearer $CRON_SECRET"         https://www.dataparl.fr/api/cron/anti-abus
  retry:
    max: 1
    when: script_failure
